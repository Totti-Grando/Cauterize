[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aah"
version = "0.1.0"
description = "Agent Quality & Security Assurance Harness (spec v3)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# F9: optional local NLI claim-checker. Heavy (pulls torch/transformers) — the base install
# stays torch-free; the router's nli slot uses ClaudeNLIScorer or HttpNLIScorer by default.
nli_local = ["minicheck"]

[tool.setuptools.packages.find]
include = ["aah*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
